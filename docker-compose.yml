services:
  web-profile:
    restart: always
    build: .
    image: ghcr.io/ianfebi01/web-profile-dev:latest
    container_name: web-profile
    ports:
      - 3001:3000
    networks:
      - proxy
    env_file:
      - .env.local
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
networks:
  proxy:
    external: true

name: Generate Daily Article

on:
  schedule:
    # 01:00 UTC = 08:00 WIB
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Generate even if an AI article was already created in the last 20h'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25

    steps:
      - name: Generate article with Gemini
        env:
          BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          PAYLOAD_API_KEY: ${{ secrets.PAYLOAD_API_KEY }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          api="${BASE_URL%/}/api/articles/generate"
          auth="Authorization: users API-Key ${PAYLOAD_API_KEY}"

          # Generation takes longer than the proxy timeout, so the endpoint starts it
          # in the background (202) and we poll for the result.
          status=$(curl -sS -o start.json -w '%{http_code}' --max-time 60 \
            -X POST "${api}?force=${FORCE}" -H "$auth")
          cat start.json; echo
          if [ "$status" != 202 ]; then
            echo "::error::Could not start article generation (HTTP $status)"
            exit 1
          fi
          run_id=$(jq -r .runId start.json)

          # Up to 20 min: Gemini retries and model fallback can add several minutes when it's busy
          for _ in $(seq 1 80); do
            sleep 15
            curl -sS --max-time 30 -o state.json "${api}/status" -H "$auth" || continue
            if [ "$(jq -r .runId state.json)" = "$run_id" ] && [ "$(jq -r .running state.json)" = false ]; then
              jq . state.json
              if [ "$(jq -r '.error // empty' state.json)" ]; then
                echo "::error::$(jq -r .error state.json)"
                exit 1
              fi
              echo "::notice::$(jq -r '.result | if .status == "created" then "Created: \(.title)" else "Skipped: \(.reason)" end' state.json)"
              exit 0
            fi
          done

          echo "::error::Timed out waiting for article generation"
          exit 1

name: Build and Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/ianfebi01/web-profile:latest
          build-args: |
            NEXT_PUBLIC_GOOGLE_ANALYTICS=${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            APP_ENV=${{ secrets.APP_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload app image & configs to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: /tmp/web-profile
          strip_components: 0
          rm: false
          debug: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            mkdir -p ~/app/web-profile
            cp /tmp/web-profile/docker-compose.prod.yml ~/app/web-profile/docker-compose.prod.yml
            cd ~/app/web-profile

            pulled=false
            for attempt in 1 2 3; do
              if docker compose -f docker-compose.prod.yml --env-file .env.production pull; then
                pulled=true
                break
              fi
              echo "Pull failed (attempt $attempt/3), retrying in 15s..."
              sleep 15
            done
            if [ "$pulled" != true ]; then
              echo "Could not pull image from ghcr.io; leaving the running container untouched."
              exit 1
            fi

            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
            docker image prune -f
            rm -rf /tmp/web-profile

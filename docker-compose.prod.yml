services:
  web-profile:
    restart: always
    image: ghcr.io/ianfebi01/web-profile:latest
    pull_policy: always
    container_name: web-profile
    # ports:
    #   - 3001:3000
    networks:
      - proxy
    env_file:
      - .env.production
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
networks:
  proxy:
    external: true
